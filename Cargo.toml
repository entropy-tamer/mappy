[workspace]
members = [
    "mappy-core",
    "mappy-client",
    "mappy-python",
    "mappy-server",
    "stilts"
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/mappy"
description = "Space-efficient maplet data structures for approximate key-value mappings"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50.0", features = ["full"] }
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bitcode = "0.6.9"

# Hashing and bit operations
ahash = "0.8.12"
bitvec = "1.0.1"
twox-hash = "2.1.2"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Concurrency
parking_lot = "0.12.5"
rayon = "1.11.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Testing
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.10.0"
quickcheck = "1.1.0"

# Python bindings
pyo3 = { version = "0.28.2", features = ["extension-module"] }

# Additional dependencies
getrandom = "0.4.2"
rand = "0.10.0"
rand_core = "0.10.0"

# Web server dependencies
axum = { version = "0.8.8", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs"] }
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
tls = { package = "tokio-rustls", version = "0.26.4" }
config = "0.15.22"
dotenvy = "0.15.7"

# HTTP client dependencies
reqwest = { version = "0.13.2", features = ["json"] }
urlencoding = "2.1.3"

# Storage dependencies
sled = "0.34.7"
dashmap = "6.1.0"

# Plotting dependencies
plotters = "0.3.7"

# Workspace lint configuration
[workspace.lints.clippy]
# Allow multiple crate versions for transitive dependencies we cannot control
# - sled 0.34.7 requires parking_lot 0.11.2 (we use 0.12.5)
# - png 0.17.16 (via plotters) requires bitflags 1.3.2 (we use 2.9.4)
# - Other conflicts are from transitive dependencies of third-party crates
multiple-crate-versions = "allow"
