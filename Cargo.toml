[workspace]
members = [
    "mappy-core",
    "mappy-client",
    "mappy-python",
    "mappy-server",
    "mappy-proxy",
    "stilts"
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/mappy"
description = "Space-efficient maplet data structures for approximate key-value mappings"

[workspace.dependencies]
# Async runtime
tokio = { path = "../../vendor/tokio/tokio", features = ["full"] }
async-trait = { path = "../../vendor/async-trait" }

# Serialization
serde = { path = "../../vendor/serde/serde", features = ["derive"] }
serde_json = { path = "../../vendor/serde_json" }
bitcode = { path = "../../vendor/bitcode" }

# Hashing and bit operations
ahash = { path = "../../vendor/ahash" }
bitvec = { path = "../../vendor/bitvec" }
twox-hash = "2.1.2"

# Error handling
anyhow = { path = "../../vendor/anyhow" }
thiserror = { path = "../../vendor/thiserror" }

# Concurrency
parking_lot = { path = "../../vendor/parking_lot" }
rayon = { path = "../../vendor/rayon" }

# Logging
tracing = { path = "../../vendor/tracing/tracing" }
tracing-subscriber = { path = "../../vendor/tracing/tracing-subscriber", features = ["env-filter"] }

# Testing
criterion = { path = "../../vendor/criterion", features = ["html_reports"] }
proptest = "1.11.0"
quickcheck = { path = "../../vendor/quickcheck"}

# Python bindings
pyo3 = { version = "0.28.3", features = ["extension-module"] }

# Additional dependencies
getrandom = { path = "../../vendor/getrandom" }
rand = { path = "../../vendor/rand" }
rand_core = { path = "../../vendor/rand_core" }
futures = { path = "../../vendor/futures-rs/futures", features = ["executor"] }
futures-core = { path = "../../vendor/futures-rs/futures-core", default-features = false }
futures-util = { path = "../../vendor/futures-rs/futures-util", default-features = false, features = ["alloc"] }
futures-sink = { path = "../../vendor/futures-rs/futures-sink" }

# Web server dependencies
axum = { path = "../../vendor/axum/axum", features = ["macros"] }
tokio-tungstenite = { path = "../../vendor/tokio-tungstenite" }
tower = { path = "../../vendor/tower/tower", features = ["util"] }
tower-http = { path = "../../vendor/tower-http/tower-http", features = ["cors", "trace", "fs"] }
hyper = { path = "../../vendor/hyper", features = ["full", "http1", "http2"] }
hyper-util = { path = "../../vendor/hyper-util", features = ["full"] }
http-body-util = { path = "../../vendor/http-body/http-body-util" }
tokio-rustls = { path = "../../vendor/tokio-rustls" }
rustls-ring = { path = "../../vendor/rustls/rustls-ring" }
config = { path = "../../vendor/config" }
dotenvy = { path = "../../vendor/dotenvy/dotenvy" }

# HTTP client dependencies
reqwest = { path = "../../vendor/reqwest", features = ["json", "rustls", "__rustls-ring"] }
urlencoding = "2.1.3"

# Storage dependencies
sled = { path = "../../vendor/sled" }
dashmap = "6.1.0"

# Plotting dependencies
plotters = { path = "../../vendor/plotters/plotters" }

[patch.crates-io]
bytes = { path = "../../vendor/bytes" }
serde = { path = "../../vendor/serde/serde" }
serde_core = { path = "../../vendor/serde/serde_core" }
serde_derive = { path = "../../vendor/serde/serde_derive" }
futures = { path = "../../vendor/futures-rs/futures" }
futures-core = { path = "../../vendor/futures-rs/futures-core" }
futures-sink = { path = "../../vendor/futures-rs/futures-sink" }
futures-util = { path = "../../vendor/futures-rs/futures-util" }
http = { path = "../../vendor/http" }
http-body = { path = "../../vendor/http-body/http-body" }
http-body-util = { path = "../../vendor/http-body/http-body-util" }
tower-service = { path = "../../vendor/tower/tower-service" }
tower-layer = { path = "../../vendor/tower/tower-layer" }
tower = { path = "../../vendor/tower/tower" }
rustls = { path = "../../vendor/rustls/rustls" }
rustls-ring = { path = "../../vendor/rustls/rustls-ring" }
rustls-pki-types = { path = "../../vendor/rustls-pki-types" }
chrono = { path = "../../vendor/chrono" }
indexmap = { path = "../../vendor/indexmap" }
thiserror = { path = "../../vendor/thiserror" }
thiserror-impl = { path = "../../vendor/thiserror/impl" }
once_cell = { path = "../../vendor/once_cell" }
memchr = { path = "../../vendor/memchr" }
log = { path = "../../vendor/log" }
smallvec = { path = "../../vendor/smallvec" }
cfg-if = { path = "../../vendor/cfg-if" }
