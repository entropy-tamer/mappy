[workspace]
members = [
    "mappy-core",
    "mappy-client",
    "mappy-python",
    "mappy-server",
    "mappy-proxy",
    "stilts"
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://git.sly.so/kade/mappy"
description = "Space-efficient maplet data structures for approximate key-value mappings"

[workspace.dependencies]
# Async runtime
tokio = { git = "https://git.sly.so/kade/tokio", features = ["full"] }
async-trait = { git = "https://git.sly.so/kade/async-trait" }

# Serialization
serde = { git = "https://git.sly.so/kade/serde", package = "serde", features = ["derive"] }
serde_json = { git = "https://git.sly.so/kade/serde_json" }
bitcode = { git = "https://git.sly.so/kade/bitcode" }

# Hashing and bit operations  
ahash = { git = "https://git.sly.so/kade/ahash", rev = "999fd53" }  # Latest commit with SIMD fixes
fnv = { git = "https://git.sly.so/kade/fnv" }  # Fallback hash without SIMD
bitvec = { git = "https://git.sly.so/kade/bitvec" }
twox-hash = { git = "https://git.sly.so/kade/twox-hash" }

# Error handling
anyhow = { git = "https://git.sly.so/kade/anyhow" }
thiserror = { git = "https://git.sly.so/kade/thiserror" }

# Concurrency
parking_lot = { git = "https://git.sly.so/kade/parking_lot" }
rayon = { git = "https://git.sly.so/kade/rayon" }

# Logging
tracing = { git = "https://git.sly.so/kade/tracing", package = "tracing" }
tracing-subscriber = { git = "https://git.sly.so/kade/tracing", package = "tracing-subscriber", features = ["env-filter"] }

# Testing
criterion = { git = "https://git.sly.so/kade/criterion", features = ["html_reports"] }
proptest = { git = "https://git.sly.so/kade/proptest" }
quickcheck = { git = "https://git.sly.so/kade/quickcheck"}

# Python bindings
pyo3 = { git = "https://git.sly.so/kade/pyo3", features = ["extension-module"] }

# Additional dependencies
getrandom = { git = "https://git.sly.so/kade/getrandom" }
rand = { git = "https://git.sly.so/kade/rand" }
rand_core = { git = "https://git.sly.so/kade/rand_core" }
tempfile = { git = "https://git.sly.so/kade/tempfile" }
futures = { git = "https://git.sly.so/kade/futures-rs", package = "futures" }
futures-core = { git = "https://git.sly.so/kade/futures-rs", package = "futures-core", default-features = false }
futures-util = { git = "https://git.sly.so/kade/futures-rs", package = "futures-util", default-features = false, features = ["alloc"] }
futures-sink = { git = "https://git.sly.so/kade/futures-rs", package = "futures-sink" }

# Web server dependencies
axum = { git = "https://git.sly.so/kade/axum", package = "axum", features = ["macros"] }
tokio-tungstenite = { git = "https://git.sly.so/kade/tokio-tungstenite" }
tower = { git = "https://git.sly.so/kade/tower", package = "tower", features = ["util"] }
tower-http = { git = "https://git.sly.so/kade/tower-http", package = "tower-http", features = ["cors", "trace", "fs"] }
hyper = { git = "https://git.sly.so/kade/hyper", features = ["full", "http1", "http2"] }
hyper-util = { git = "https://git.sly.so/kade/hyper-util", features = ["full"] }
http-body-util = { git = "https://git.sly.so/kade/http-body", package = "http-body-util" }
tokio-rustls = { git = "https://git.sly.so/kade/tokio-rustls" }
rustls-ring = { git = "https://git.sly.so/kade/rustls", package = "rustls-ring" }
config = { git = "https://git.sly.so/kade/config-rs" }
dotenvy = { git = "https://git.sly.so/kade/dotenvy", package = "dotenvy" }

# HTTP client dependencies
reqwest = { git = "https://git.sly.so/kade/reqwest", features = ["json", "rustls", "__rustls-ring"] }
urlencoding = { git = "https://git.sly.so/kade/urlencoding" }

# Storage dependencies
sled = { git = "https://git.sly.so/kade/sled" }
dashmap = { git = "https://git.sly.so/kade/dashmap" }
num-traits = { git = "https://git.sly.so/kade/num-traits" }
bytemuck = { git = "https://git.sly.so/kade/bytemuck" }
smallvec = { git = "https://git.sly.so/kade/smallvec" }

# Plotting dependencies
plotters = { git = "https://git.sly.so/kade/plotters", package = "plotters" }

[patch.crates-io]
proc-macro2 = { git = "https://git.sly.so/kade/proc-macro2" }
syn = { git = "https://git.sly.so/kade/syn" }
quote = { git = "https://git.sly.so/kade/quote" }
bytes = { git = "https://git.sly.so/kade/bytes" }
tokio = { git = "https://git.sly.so/kade/tokio", package = "tokio" }
tokio-util = { git = "https://git.sly.so/kade/tokio", package = "tokio-util" }
tokio-test = { git = "https://git.sly.so/kade/tokio", package = "tokio-test" }
serde = { git = "https://git.sly.so/kade/serde", package = "serde" }
serde_core = { git = "https://git.sly.so/kade/serde", package = "serde_core" }
serde_derive = { git = "https://git.sly.so/kade/serde", package = "serde_derive" }
futures = { git = "https://git.sly.so/kade/futures-rs", package = "futures" }
futures-core = { git = "https://git.sly.so/kade/futures-rs", package = "futures-core" }
futures-sink = { git = "https://git.sly.so/kade/futures-rs", package = "futures-sink" }
futures-util = { git = "https://git.sly.so/kade/futures-rs", package = "futures-util" }
http = { git = "https://git.sly.so/kade/http" }
http-body = { git = "https://git.sly.so/kade/http-body", package = "http-body" }
http-body-util = { git = "https://git.sly.so/kade/http-body", package = "http-body-util" }
tower-service = { git = "https://git.sly.so/kade/tower", package = "tower-service" }
tower-layer = { git = "https://git.sly.so/kade/tower", package = "tower-layer" }
tower = { git = "https://git.sly.so/kade/tower", package = "tower" }
rustls = { git = "https://git.sly.so/kade/rustls", package = "rustls" }
rustls-ring = { git = "https://git.sly.so/kade/rustls", package = "rustls-ring" }
rustls-pki-types = { git = "https://git.sly.so/kade/rustls-pki-types" }
chrono = { git = "https://git.sly.so/kade/chrono" }
indexmap = { git = "https://git.sly.so/kade/indexmap" }
thiserror = { git = "https://git.sly.so/kade/thiserror" }
once_cell = { git = "https://git.sly.so/kade/once_cell" }
memchr = { git = "https://git.sly.so/kade/memchr" }
log = { git = "https://git.sly.so/kade/log" }
smallvec = { git = "https://git.sly.so/kade/smallvec" }
cfg-if = { git = "https://git.sly.so/kade/cfg-if" }
regex-automata = { git = "https://git.sly.so/kade/regex" }
matchers = { git = "https://git.sly.so/kade/matchers" }
nu-ansi-term = { git = "https://git.sly.so/kade/nu-ansi-term" }
sharded-slab = { git = "https://git.sly.so/kade/sharded-slab" }
thread_local = { git = "https://git.sly.so/kade/thread_local-rs" }
parking_lot_core = { git = "https://git.sly.so/kade/parking_lot_core" }
icu_normalizer = { git = "https://git.sly.so/kade/icu4x", package = "icu_normalizer" }
