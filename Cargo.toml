[workspace]
members = [
    "mappy-core",
    "mappy-client",
    "mappy-python",
    "mappy-server",
    "mappy-proxy",
    "mappy-daemon"
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://git.sly.so/kade/mappy"

[workspace.dependencies]
# Async runtime
tokio = { git = "https://git.sly.so/kade/tokio", features = ["full"] }
async-trait = { git = "https://git.sly.so/kade/async-trait" }

# Serialization
serde = { git = "https://git.sly.so/kade/serde", package = "serde", features = ["derive"] }
serde_json = { git = "https://git.sly.so/kade/serde_json" }

# Hashing and bit operations
# kade/ahash default branch is master. This tracked `rev = "999fd53"` (SIMD fixes),
# which was HEAD at the time -- so the pin froze the crate at the branch tip rather
# than pointing behind it, and cost nothing to resolve. Un-pinned 2026-10-02: same
# commit today, but the crate now follows its default branch as the pact requires.
ahash = { git = "https://git.sly.so/kade/ahash" }
twox-hash = { git = "https://git.sly.so/kade/twox-hash" }

# Error handling
anyhow = { git = "https://git.sly.so/kade/anyhow" }
thiserror = { git = "https://git.sly.so/kade/thiserror" }

# Concurrency
rayon = { git = "https://git.sly.so/kade/rayon" }

# Logging
tracing = { git = "https://git.sly.so/kade/tracing", package = "tracing" }
tracing-subscriber = { git = "https://git.sly.so/kade/tracing", package = "tracing-subscriber", features = ["env-filter"] }

# Testing
# criterion 0.8 moved async support behind opt-in features: its `default` is
# ["rayon", "plotters", "cargo_bench_support", "alloca"] and no longer implies
# `async_tokio`/`async_smol`/`async_futures`. Without them, `Bencher::to_async`
# exists in the source but every `impl AsyncExecutor for tokio::runtime::Runtime`
# is `#[cfg(feature = "async_tokio")]`-gated, so the method is not applicable and
# rustc reports E0599 "no method named `to_async`" rather than a missing feature.
# Both runtimes are enabled because mappy-core's default features are smol and its
# dev-dependency tests are tokio.
criterion = { git = "https://git.sly.so/kade/criterion", features = ["html_reports", "async_tokio", "async_smol", "async_futures"] }
proptest = { git = "https://git.sly.so/kade/proptest" }
quickcheck = { git = "https://git.sly.so/kade/quickcheck"}

# Python bindings
pyo3 = { git = "https://git.sly.so/kade/pyo3", features = ["extension-module"] }

# Smol async runtime (for mappy-daemon)
smol = { git = "https://git.sly.so/kade/smol" }
async-net = { git = "https://git.sly.so/kade/async-net" }
futures-lite = { git = "https://git.sly.so/kade/futures-lite" }
async-lock = { git = "https://git.sly.so/kade/async-lock" }
async-channel = { git = "https://git.sly.so/kade/async-channel" }

# Additional dependencies
rand = { git = "https://git.sly.so/kade/rand" }
tempfile = { git = "https://git.sly.so/kade/tempfile" }
futures = { git = "https://git.sly.so/kade/futures-rs", package = "futures" }

# Web server dependencies
axum = { git = "https://git.sly.so/kade/axum", package = "axum", features = ["macros"] }
tower = { git = "https://git.sly.so/kade/tower", package = "tower", features = ["util"] }
tower-http = { git = "https://git.sly.so/kade/tower-http", package = "tower-http", features = ["cors", "trace", "fs"] }
hyper = { git = "https://git.sly.so/kade/hyper", features = ["full", "http1", "http2"] }
hyper-util = { git = "https://git.sly.so/kade/hyper-util", features = ["full"] }
dotenvy = { git = "https://git.sly.so/kade/dotenvy", package = "dotenvy" }

# HTTP client dependencies
reqwest = { git = "https://git.sly.so/kade/reqwest", features = ["json", "rustls", "__rustls-ring"] }
urlencoding = { git = "https://git.sly.so/kade/urlencoding" }

# Storage dependencies
sled = { git = "https://git.sly.so/kade/sled" }
dashmap = { git = "https://git.sly.so/kade/dashmap" }
bytemuck = { git = "https://git.sly.so/kade/bytemuck" }
