[package]
name = "python-mappy-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance Rust-native ML data pipeline for mappy with image decoding and zero-copy tensor export"
keywords = ["machine-learning", "data-pipeline", "pytorch", "tensor", "image-processing", "python"]
categories = ["machine-learning", "data-structures", "python"]
rust-version = "1.98.1"

[lib]
name = "python_mappy_ml"
crate-type = ["cdylib"]

[dependencies]
# Workspace dependencies
mappy-core = { path = "../mappy-core" }
pyo3 = { workspace = true, features = ["extension-module"] }
serde.workspace = true
rayon.workspace = true

# Image processing
image = { path = "../../../vendor/image" }
imageproc = "0.25.0"
memmap2 = "0.9.9"

# NumPy integration
numpy = "0.27.0"
ndarray = "0.16.1"  # Must match numpy-rs's ndarray version

# Tensor export
tch = "0.22.0"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "benchmark_pipeline"
harness = false
