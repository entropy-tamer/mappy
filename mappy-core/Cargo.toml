[package]
name = "mappy-core"
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/reynard"
description = "Core maplet data structure implementation"
readme = "README.md"
keywords = ["data-structures", "filters", "approximate", "space-efficient", "maplets"]
categories = ["data-structures", "algorithms"]
rust-version = "1.101"

[features]
default = ["quotient-filter", "smol"]
quotient-filter = []
# Use smol as the async runtime (default)
smol = ["dep:smol", "dep:futures-lite"]
# Use tokio as the async runtime (opt-in)
tokio = ["dep:tokio"]

[dependencies]
# Core dependencies with explicit versions
ahash.workspace = true
twox-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
tracing.workspace = true

# Additional dependencies
bytemuck.workspace = true

# Runtime-agnostic async primitives (always used)
async-lock.workspace = true
async-channel.workspace = true
async-trait.workspace = true

# Feature-gated async runtimes
smol = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Storage backends
dashmap.workspace = true
sled.workspace = true
tempfile.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
quickcheck.workspace = true
tempfile.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# Tests always use tokio for #[tokio::test]
tokio = { workspace = true }

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "maplet_vs_std"
harness = false

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "basic_quotient_filter_benchmarks"
harness = false


# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
multiple_crate_versions = "allow"
