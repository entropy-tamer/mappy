[package]
name = "mappy-core"
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/reynard"
description = "Core maplet data structure implementation"
readme = "README.md"
keywords = ["data-structures", "filters", "approximate", "space-efficient", "maplets"]
categories = ["data-structures", "algorithms"]

[features]
default = ["quotient-filter"]
quotient-filter = []

[dependencies]
# Core dependencies with explicit versions
ahash.workspace = true
bitvec.workspace = true
twox-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
rayon.workspace = true
tracing.workspace = true

# Additional dependencies
num-traits = "0.2"
smallvec = "1.13"
bytemuck = "1.19"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Storage backends
dashmap = "6.1.0"
sled = "0.34"
tempfile.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest = "1.10.0"
quickcheck.workspace = true
tempfile.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "maplet_vs_std"
harness = false

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "basic_quotient_filter_benchmarks"
harness = false


# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
# Allow multiple crate versions for transitive dependencies we cannot control
# - sled 0.34.7 requires parking_lot 0.11.2 (we use 0.12.5)
# - png 0.17.16 (via plotters) requires bitflags 1.3.2 (we use 2.9.4)
# - Other conflicts are from transitive dependencies of third-party crates
multiple-crate-versions = "allow"
