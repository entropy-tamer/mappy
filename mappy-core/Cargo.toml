[package]
name = "mappy-core"
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/reynard"
description = "Core maplet data structure implementation"
readme = "README.md"
keywords = ["data-structures", "filters", "approximate", "space-efficient", "maplets"]
categories = ["data-structures", "algorithms"]

[features]
default = ["quotient-filter"]
quotient-filter = []

[dependencies]
# Core dependencies with explicit versions
ahash = "0.8.12"
bitvec = "1.0.1"
twox-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
parking_lot = "0.12.5"
rayon = "1.11.0"
tracing = "0.1.44"

# Additional dependencies
num-traits = "0.2.19"
smallvec = "1.15.1"
bytemuck = "1.25.0"

# Async runtime
tokio = { version = "1.50.0", features = ["full"] }
async-trait = "0.1.89"

# Storage backends
dashmap = "6.1.0"
sled = "0.34.7"
tempfile = "3.27.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.10.0"
quickcheck = "1.1.0"
tempfile = "3.27.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
redis = { version = "1.1.0", features = ["tokio-comp", "aio"] }

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "maplet_vs_std"
harness = false

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "redis_comparison"
harness = false

[[bench]]
name = "basic_quotient_filter_benchmarks"
harness = false


# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
# Allow multiple crate versions for transitive dependencies we cannot control
# - sled 0.34.7 requires parking_lot 0.11.2 (we use 0.12.5)
# - png 0.17.16 (via plotters) requires bitflags 1.3.2 (we use 2.9.4)
# - Other conflicts are from transitive dependencies of third-party crates
multiple-crate-versions = "allow"
