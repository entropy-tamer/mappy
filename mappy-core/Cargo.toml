[package]
name = "mappy-core"
version = "0.3.2"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
repository = "https://github.com/entropy-tamer/reynard"
description = "Core maplet data structure implementation"
readme = "README.md"
keywords = ["data-structures", "filters", "approximate", "space-efficient", "maplets"]
categories = ["data-structures", "algorithms"]

[features]
default = ["quotient-filter"]
quotient-filter = []

[dependencies]
# Core dependencies with explicit versions
ahash = "0.8.12"
bitvec = { path = "../../../vendor/bitvec" }
twox-hash = "2.1.2"
serde = { path = "../../../vendor/serde/serde", features = ["derive"] }
serde_json = { path = "../../../vendor/serde_json" }
anyhow = { path = "../../../vendor/anyhow" }
thiserror = "2.0.18"
parking_lot = "0.12.5"
rayon = { path = "../../../vendor/rayon" }
tracing = { path = "../../../vendor/tracing/tracing" }

# Additional dependencies
num-traits = "0.2.19"
smallvec = "1.15.1"
bytemuck = { path = "../../../vendor/bytemuck" }

# Async runtime
tokio = { path = "../../../vendor/tokio/tokio", features = ["full"] }
async-trait = { path = "../../../vendor/async-trait" }

# Storage backends
dashmap = "6.1.0"
sled = {path = "../../../vendor/sled" }
tempfile = "3.27.0"

[dev-dependencies]
criterion = { path = "../../../vendor/criterion"}
proptest = "1.10.0"
quickcheck = "1.1.0"
tempfile = "3.27.0"
rand = { path = "../../../vendor/rand" }
serde = { path = "../../../vendor/serde/serde", features = ["derive"] }
serde_json = { path = "../../../vendor/serde_json" }
redis = { version = "1.1.0", features = ["tokio-comp", "aio"] }

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "maplet_vs_std"
harness = false

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "redis_comparison"
harness = false

[[bench]]
name = "basic_quotient_filter_benchmarks"
harness = false


# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
# Allow multiple crate versions for transitive dependencies we cannot control
# - sled 0.34.7 requires parking_lot 0.11.2 (we use 0.12.5)
# - png 0.17.16 (via plotters) requires bitflags 1.3.2 (we use 2.9.4)
# - Other conflicts are from transitive dependencies of third-party crates
multiple-crate-versions = "allow"
