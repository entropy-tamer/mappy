# Woodpecker CI pipeline for kade Rust projects.
#
# Image 1.102 adds git to the toolchain image, so cargo fetches git
# dependencies with the CLI (much faster than the builtin fetch) and keeps
# them in the woodpecker-cargo volume shared across builds.
#
# The pact step is a ratchet: the number of crates.io sources in Cargo.lock
# may not rise above the recorded baseline. The baseline is the migration
# debt, not compliance -- drop it as dependencies move to git.sly.so.

when:
  - event: [push, pull_request]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  pact:
    image: localhost/kade-rust:1.103
    pull: false
    commands:
      - |
        set -eu
        if [ ! -f Cargo.lock ]; then
          echo "no Cargo.lock; pact baseline not applicable"
          exit 0
        fi
        count=$(grep -c '^source = "registry+' Cargo.lock || true)
        echo "registry sources: $count (baseline ${SLY_PACT_MAX_REGISTRY:-unset})"
        if [ -n "${SLY_PACT_MAX_REGISTRY:-}" ] && [ "$count" -gt "$SLY_PACT_MAX_REGISTRY" ]; then
          echo "FAIL: registry dependency count rose above the recorded baseline"
          exit 1
        fi
    environment:
      SLY_PACT_MAX_REGISTRY: "211"

  build:
    image: localhost/kade-rust:1.103
    pull: false
    depends_on: [pact]
    commands:
      - rustc -V
      - cargo -V
      - cargo build --release
    environment:
      CARGO_NET_OFFLINE: "false"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_UNSTABLE_HEADSTART: "true"

  test:
    image: localhost/kade-rust:1.103
    pull: false
    depends_on: [build]
    commands:
      - cargo test --release
    environment:
      CARGO_NET_OFFLINE: "false"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_UNSTABLE_HEADSTART: "true"

  clippy:
    image: localhost/kade-rust:1.103
    pull: false
    depends_on: [test]
    # The forks are mid-migration to edition 2024; -D warnings turns that debt
    # into a red pipeline and hides the build result. Advisory until cleaned.
    failure: ignore
    commands:
      - cargo clippy --release -- -D warnings
    environment:
      CARGO_NET_OFFLINE: "false"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_UNSTABLE_HEADSTART: "true"

  # A fork's formatting drifts from the toolchain's rustfmt; report it without
  # hiding the build and test result.
  fmt:
    image: localhost/kade-rust:1.103
    pull: false
    depends_on: [clippy]
    failure: ignore
    commands:
      - cargo fmt --all --check
