[package]
name = "stilts"
version = "0.1.0"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
description = "Tag compression library with multiple algorithms (Huffman, Arithmetic, Dictionary)"
repository = "https://github.com/entropy-tamer/mappy"
keywords = ["compression", "huffman", "arithmetic", "dictionary", "tags"]
categories = ["compression", "algorithms"]

[dependencies]
# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bitcode.workspace = true

# Bit manipulation
bitvec = "1.0.1"

# Compression comparison
flate2 = "1.1.9"
lz4 = "1.28.1"

# Parallel processing
rayon = "1.11.0"

# Plotting
plotters.workspace = true

# Hashing
ahash = "0.8.12"

# Collections
indexmap = "2.13.0"

# Date/time for reports
chrono = "0.4.44"

# Async runtime (for ML benchmarks with mappy)
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Mappy integration (optional, for benchmarks)
mappy-core = { path = "../mappy-core", optional = true }

[features]
default = []
mappy-integration = ["mappy-core", "tokio"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.10.0"
mappy-core = { path = "../mappy-core" }

[[bench]]
name = "compression_benchmarks"
harness = false

[[bench]]
name = "comparison_benchmarks"
harness = false

[[bench]]
name = "ml_performance_benchmarks"
harness = false

