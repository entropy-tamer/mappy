[package]
name = "stilts"
version = "0.1.0"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
description = "Tag compression library with multiple algorithms (Huffman, Arithmetic, Dictionary)"
repository = "https://github.com/entropy-tamer/mappy"
keywords = ["compression", "huffman", "arithmetic", "dictionary", "tags"]
categories = ["compression", "algorithms"]
rust-version = "1.98.1"

[dependencies]
# Error handling
anyhow = { git = "https://git.sly.so/kade/anyhow" }
thiserror = { git = "https://git.sly.so/kade/thiserror" }

# Serialization
serde = { git = "https://git.sly.so/kade/serde", features = ["derive"] }
serde_json = { git = "https://git.sly.so/kade/serde_json" }
bitcode.workspace = true

# Bit manipulation
bitvec = { git = "https://git.sly.so/kade/bitvec" }

# Compression comparison
flate2 = { git = "https://git.sly.so/kade/flate2-rs" }
lz4 = { git = "https://git.sly.so/kade/lz4-rs" }

# Parallel processing
rayon = { git = "https://git.sly.so/kade/rayon" }

# Plotting
plotters.workspace = true

# Hashing
ahash = { git = "https://git.sly.so/kade/ahash" }

# Collections
indexmap = { git = "https://git.sly.so/kade/indexmap" }

# Date/time for reports
chrono = { git = "https://git.sly.so/kade/chrono" }

# Async runtime (for ML benchmarks with mappy)
tokio = { git = "https://git.sly.so/kade/tokio", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Mappy integration (optional, for benchmarks)
mappy-core = { path = "../mappy-core", optional = true }

[features]
default = []
mappy-integration = ["mappy-core", "tokio"]

[dev-dependencies]
criterion = { git = "https://git.sly.so/kade/criterion", features = ["html_reports"] }
proptest = { git = "https://git.sly.so/kade/proptest" }
mappy-core = { path = "../mappy-core" }

[[bench]]
name = "compression_benchmarks"
harness = false

[[bench]]
name = "comparison_benchmarks"
harness = false

[[bench]]
name = "ml_performance_benchmarks"
harness = false
# Every benchmark in this file is `#[cfg(feature = "mappy-integration")]`, and
# `criterion_group!` with no functions is a macro error rather than an empty bench.
# Declaring the requirement lets cargo skip the target instead of failing to build it.
required-features = ["mappy-integration"]

[[bench]]
name = "storage_benchmarks"
harness = false
# Uses `stilts::benchmark::mappy_comparison`, which is `#[cfg(feature = "mappy-integration")]`.
required-features = ["mappy-integration"]
