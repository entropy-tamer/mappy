[package]
name = "stilts"
version = "0.1.0"
edition = "2024"
authors = ["Balazs Horvath"]
license = "MIT"
description = "Tag compression library with multiple algorithms (Huffman, Arithmetic, Dictionary)"
repository = "https://github.com/entropy-tamer/mappy"
keywords = ["compression", "huffman", "arithmetic", "dictionary", "tags"]
categories = ["compression", "algorithms"]

[dependencies]
# Error handling
anyhow = { path = "../../../vendor/anyhow" }
thiserror = "2.0.18"

# Serialization
serde = { path = "../../../vendor/serde/serde", features = ["derive"] }
serde_json = { path = "../../../vendor/serde_json" }
bitcode.workspace = true

# Bit manipulation
bitvec = { path = "../../../vendor/bitvec" }

# Compression comparison
flate2 = "1.1.9"
lz4 = "1.28.1"

# Parallel processing
rayon = { path = "../../../vendor/rayon" }

# Plotting
plotters.workspace = true

# Hashing
ahash = { path = "../../../vendor/ahash" }

# Collections
indexmap = "2.13.0"

# Date/time for reports
chrono = "0.4.44"

# Async runtime (for ML benchmarks with mappy)
tokio = { path = "../../../vendor/tokio/tokio", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Mappy integration (optional, for benchmarks)
mappy-core = { path = "../mappy-core", optional = true }

[features]
default = []
mappy-integration = ["mappy-core", "tokio"]

[dev-dependencies]
criterion = { path = "../../../vendor/criterion", features = ["html_reports"] }
proptest = "1.10.0"
mappy-core = { path = "../mappy-core" }

[[bench]]
name = "compression_benchmarks"
harness = false

[[bench]]
name = "comparison_benchmarks"
harness = false

[[bench]]
name = "ml_performance_benchmarks"
harness = false

