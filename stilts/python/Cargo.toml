[package]
name = "stilts-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "stilts_python"
crate-type = ["cdylib"]

[dependencies]
stilts = { path = ".." }
pyo3 = { version = "0.28.2", features = ["extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-system]
requires = ["maturin"]
build-backend = "maturin"
