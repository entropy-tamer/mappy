[package]
name = "mappy-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Network server for Mappy service"
readme = "README.md"
keywords = ["mappy", "maplet", "data-structures", "server", "api"]
categories = ["data-structures", "web-programming::http-server"]
rust-version = "1.102.0"

[features]
default = ["tokio-runtime"]
tokio-runtime = ["tokio"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true, optional = true }  # Make tokio optional
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
hyper.workspace = true
hyper-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true

# Local dependencies
mappy-core = { git = "https://git.sly.so/kade/mappy", package = "mappy-core" }

# Additional dependencies
bytes = { git = "https://git.sly.so/kade/bytes" }
tokio-util = { git = "https://git.sly.so/kade/tokio", package = "tokio-util", features = ["codec"] }
async-stream = { git = "https://git.sly.so/kade/async-stream" }
futures.workspace = true

# Binary target
[[bin]]
name = "mappy-server"
path = "src/main.rs"

# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
multiple_crate_versions = "allow"
